<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-sm-2 px-lg-5 py-3">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="index.html">PixelForge</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link" href="index.html">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about.html">About us</a>

        <li class="nav-item">
          <a class="nav-link active" href="contact.html">Contact</a>

          <a class="nav-link" href="part1.html">Media Queries</a>

      </ul>

<main class="container my-5">
  <section class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
      <div class="card shadow-sm p-4">
        <h2 class="text-center mb-4">Contact Us</h2>
        <form>
          <div class="mb-3">
            <label for="nameInput" class="form-label">Full Name</label>
            <input type="text" class="form-control" id="nameInput" placeholder="Enter your full name" required>
          </div>
          <div class="mb-3">
            <label for="emailInput" class="form-label">Email address</label>
            <input type="email" class="form-control" id="emailInput" placeholder="name@example.com" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Reason for Contact</label>
            <select class="form-select" aria-label="Reason for Contact">
              <option selected>Open this select menu</option>
              <option value="1">Feedback</option>
              <option value="2">Game Request</option>
              <option value="3">Other</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label d-block">Preferred Contact Method</label>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="contactMethod" id="radioEmail" value="email" checked>
              <label class="form-check-label" for="radioEmail">Email</label>
            </div>
            <div class="form-check form-check-inline">
              <input class="form-check-input" type="radio" name="contactMethod" id="radioPhone" value="phone">
              <label class="form-check-label" for="radioPhone">Phone</label>
            </div>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="newsletterCheck">
            <label class="form-check-label" for="newsletterCheck">Subscribe to newsletter</label>
          </div>
          <div class="mb-4">
            <label for="messageTextarea" class="form-label">Message</label>
            <textarea class="form-control" id="messageTextarea" rows="4" required></textarea>
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Submit Form</button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<footer class="bg-dark text-light text-center py-4 mt-5">
  <div class="container">
    <p class="mb-0">Marat Nurdaulet | Kadyr Tlektes | Suinalin Azamat</p>
  </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
