<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Part 1 - Media Queries</title>
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}
body {
    font-family: sans-serif;
    padding: 20px;
}
h1 {
    font-size: 20px;
}
p {
    font-size: 14px;
}
.card-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 30px;
}
.card {
    border: 1px solid #ccc;
    padding: 15px;
    border-radius: 8px;
    width: 100%;
}
@media (min-width: 768px) {
    h1 {
        font-size: 28px;
    }
    p {
        font-size: 18px;
    }
    .card {
        width: calc(50% - 10px);
    }
}
@media (min-width: 1024px) {
    h1 {
        font-size: 36px;
    }
    p {
        font-size: 22px;
    }
    .card {
        width: calc(33.333% - 13.333px);
    }
}
footer {
    margin-top: 50px;
    text-align: center;
}
</style>
</head>
<body>
<h1>Responsive Typography</h1>
<p>This paragraph changes font size based on the screen size.</p>

<div class="card-container">
    <div class="card">
        <h2>Card 1</h2>
        <p>Description for card 1.</p>
    </div>
    <div class="card">
        <h2>Card 2</h2>
        <p>Description for card 2.</p>
    </div>
    <div class="card">
        <h2>Card 3</h2>
        <p>Description for card 3.</p>
    </div>
</div>
<footer>
    <p>Marat Nurdaulet | Kadyr Tlektes | Suinalin Azamat</p>
</footer>
</body>
</html>
